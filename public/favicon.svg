<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background/Outer Ring -->
  <circle cx="256" cy="256" r="220" stroke="#ff385c" stroke-width="36" fill="none" />
  
  <!-- Outer Compass Tick Ring -->
  <circle cx="256" cy="256" r="176" stroke="#ff385c" stroke-width="6" fill="none" stroke-dasharray="8 12" opacity="0.4" />
  
  <!-- Outer Ring details/points -->
  <polygon points="256,66 262,80 250,80" fill="#ff385c" />
  <polygon points="256,446 262,432 250,432" fill="#717171" />
  <polygon points="66,256 80,250 80,262" fill="#717171" />
  <polygon points="446,256 432,250 432,262" fill="#ff385c" />

  <!-- Main needle pointing Northeast (45 degrees rotated) -->
  <g transform="rotate(45 256 256)">
    <!-- North Pointer (Red/Pinkish-red) -->
    <!-- Left side of North Pointer -->
    <polygon points="256,256 226,256 256,106" fill="#ff385c" />
    <!-- Right side of North Pointer -->
    <polygon points="256,256 286,256 256,106" fill="#e61e4d" />
    
    <!-- South Pointer (Grey/Muted) -->
    <!-- Left side of South Pointer -->
    <polygon points="256,256 226,256 256,406" fill="#717171" opacity="0.9" />
    <!-- Right side of South Pointer -->
    <polygon points="256,256 286,256 256,406" fill="#dddddd" />
  </g>
  
  <!-- Center Pin -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" stroke="#ff385c" stroke-width="8" />
  <circle cx="256" cy="256" r="4" fill="#ff385c" />
</svg>
